name: CI e GitHub Pages

# Publicação atual: Settings → Pages → "Deploy from a branch" → pasta /docs
# (o site compilado é gerado com `npm run build:pages` e versionado em docs/).
#
# Alternativa: para publicar direto pelo Actions, mude Settings → Pages → Source
# para "GitHub Actions" e crie a variável de repositório PAGES_SOURCE = actions.

on:
  push:
    branches: [main, claude/loving-einstein-yz7kky]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - if: vars.PAGES_SOURCE == 'actions'
        uses: actions/configure-pages@v5
      - if: vars.PAGES_SOURCE == 'actions'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: vars.PAGES_SOURCE == 'actions'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
